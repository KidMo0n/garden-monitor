<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f5f5f5;
            --bg-card: #ffffff;
            --bg-data: #fafafa;
            --border-card: #e0e0e0;
            --border-data: #e8e8e8;
            --border-header: #f0f0f0;
            --text-primary: #333;
            --text-secondary: #666;
            --text-tertiary: #999;
            --shadow-hover: rgba(0, 0, 0, 0.1);
        }

        body.dark-theme {
            --bg-primary: #1a1a1a;
            --bg-card: #2a2a2a;
            --bg-data: #333333;
            --border-card: #404040;
            --border-data: #4a4a4a;
            --border-header: #3a3a3a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-tertiary: #808080;
            --shadow-hover: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s ease;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
        }

        .header {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 24px;
            position: relative;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .header {
                margin-bottom: 16px;
            }
            
            .header h1 {
                font-size: 22px;
            }
            
            .header p {
                font-size: 11px;
            }
        }

        .theme-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            border-color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .theme-toggle {
                right: 12px;
                padding: 6px 12px;
                font-size: 16px;
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 18px;
            border: 1px solid var(--border-card);
            transition: all 0.2s;
        }

        .card:hover {
            border-color: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow-hover);
        }

        @media (max-width: 768px) {
            .card {
                padding: 14px;
                border-radius: 10px;
            }
            
            .card:hover {
                transform: none;
            }
        }

        .card-header {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border-header);
        }

        @media (max-width: 768px) {
            .card-header {
                margin-bottom: 12px;
                padding-bottom: 10px;
            }
        }

        .garden-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
            text-align: center;
            margin-bottom: 10px;
        }

        .update-times {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .time-row {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }

        .time-row.indoor {
            justify-content: flex-start;
        }

        .time-row.outdoor {
            justify-content: flex-end;
        }

        .time-label {
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: 600;
            text-transform: uppercase;
            min-width: 28px;
        }

        .update-time {
            font-size: 11px;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            font-weight: 500;
        }

        .update-time.stale {
            color: #d32f2f;
            font-weight: 600;
        }

        body.dark-theme .update-time.stale {
            color: #ef5350;
        }

        .stale-icon {
            color: #d32f2f;
            font-size: 10px;
            margin-right: 2px;
        }

        body.dark-theme .stale-icon {
            color: #ef5350;
        }

        .source-badge {
            font-size: 7px;
            padding: 2px 4px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 4px;
        }

        .source-badge.backup {
            background: #fff3cd;
            color: #856404;
        }

        body.dark-theme .source-badge.backup {
            background: #664d03;
            color: #ffecb5;
        }

        .source-badge.primary {
            background: #d1ecf1;
            color: #0c5460;
        }

        body.dark-theme .source-badge.primary {
            background: #0c5460;
            color: #bee5eb;
        }

        .source-badge.normal {
            background: #d4edda;
            color: #155724;
        }

        body.dark-theme .source-badge.normal {
            background: #155724;
            color: #c3e6cb;
        }

        @media (max-width: 768px) {
            .garden-name {
                font-size: 20px;
            }
            
            .time-label {
                font-size: 9px;
                min-width: 24px;
            }
            
            .update-time {
                font-size: 10px;
            }
            
            .update-times {
                gap: 12px;
            }
        }

        .sensors {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 16px;
            border: 1px solid #e9ecef;
        }

        body.dark-theme .sensors {
            background: #2a2a2a;
            border-color: #404040;
        }

        @media (max-width: 768px) {
            .sensors {
                padding: 12px;
            }
        }

        .sensor-header {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            gap: 16px;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #dee2e6;
        }

        body.dark-theme .sensor-header {
            border-bottom-color: #495057;
        }

        @media (max-width: 768px) {
            .sensor-header {
                grid-template-columns: 32px 1fr 1fr;
                gap: 12px;
                padding-bottom: 8px;
                margin-bottom: 8px;
            }
        }

        .sensor-header-label {
            text-align: center;
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
            white-space: nowrap;
        }

        @media (max-width: 768px) {
            .sensor-header-label {
                font-size: 12px;
            }
        }

        .sensor {
            display: grid;
            grid-template-columns: 40px 1fr 1fr;
            gap: 16px;
            align-items: center;
            padding: 8px 0;
        }

        @media (max-width: 768px) {
            .sensor {
                grid-template-columns: 32px 1fr 1fr;
                gap: 12px;
                padding: 6px 0;
            }
        }

        .icon {
            font-size: 20px;
            text-align: left;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .icon {
                font-size: 18px;
            }
        }

        .data {
            background: transparent;
            border: none;
            padding: 0;
            text-align: center;
        }

        .value {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1.2;
        }

        @media (max-width: 768px) {
            .value {
                font-size: 13px;
            }
        }

        /* ==================== SENSOR STATUS COLORS ==================== */
        .value.status-normal {
            color: var(--text-primary);
        }

        .value.status-warning {
            color: #f57c00;
        }

        .value.status-danger {
            color: #d32f2f;
        }

        body.dark-theme .value.status-normal {
            color: var(--text-primary);
        }

        body.dark-theme .value.status-warning {
            color: #ffb74d;
        }

        body.dark-theme .value.status-danger {
            color: #ef5350;
        }

        .loading-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 40px;
            font-size: 16px;
        }

        .garden-count {
            font-size: 11px;
            color: var(--text-tertiary);
            margin-left: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Garden Monitor</h1>
        <p>Real-time sensor dashboard <span id="connection-status">⚪ Đang tải...</span><span id="garden-count" class="garden-count"></span></p>
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    </div>

    <div class="grid">
        <div class="loading-message">📡 Đang tải danh sách vườn từ Firebase...</div>
    </div>

    <script>
        // ==================== DATA CENTER ====================
        // Dữ liệu động từ Firebase - sẽ tự động tải về và sắp xếp theo bảng chữ cái
        let gardenData = {};
        let isInitialized = false;

        // ==================== CONFIGURATION ====================
        const CONFIG = {
            // FIREBASE REALTIME DATABASE URL
            // TODO: Thay URL này bằng Firebase URL của bạn
            FIREBASE_URL: 'https://gardenmonitor-ba6a8-default-rtdb.asia-southeast1.firebasedatabase.app/',
            
            // Polling interval - 1 giây cho real-time tốt
            POLL_INTERVAL: 1000,
            
            // Auto update
            AUTO_UPDATE: true,
            
            // Stale data threshold - 1 minute (60 seconds)
            STALE_THRESHOLD: 60 * 1000
        };

        // ==================== SENSOR STATUS FUNCTIONS ====================
        
        function getTempStatus(temp) {
            const t = parseFloat(temp) || 0;
            if (t < 17 || t > 30) return 'danger';
            if ((t >= 17 && t < 23) || (t > 27 && t <= 30)) return 'warning';
            if (t >= 23 && t <= 27) return 'normal';
            return 'normal';
        }

        function getHumidityStatus(humidity) {
            const h = parseFloat(humidity) || 0;
            if (h < 40 || h > 90) return 'danger';
            if ((h >= 40 && h < 60) || (h > 85 && h <= 90)) return 'warning';
            if (h >= 60 && h <= 85) return 'normal';
            return 'normal';
        }

        function getLightStatus(light) {
            const l = parseFloat(light) || 0;
            if (l > 70000) return 'danger';
            if ((l >= 45000 && l <= 70000) || l < 18000) return 'warning';
            if (l >= 18000 && l < 45000) return 'normal';
            return 'normal';
        }

        function getStatusIcon(status) {
            switch(status) {
                case 'danger': return '🚨';
                case 'warning': return '⚠️';
                case 'normal': return '✅';
                default: return '';
            }
        }

        function getStatusText(status) {
            switch(status) {
                case 'danger': return 'Nguy hiểm';
                case 'warning': return 'Cảnh báo';
                case 'normal': return 'Bình thường';
                default: return 'Không xác định';
            }
        }

        // ==================== TIME FUNCTIONS ====================
        
        function isDataStale(timestamp) {
            if (!timestamp) return true;
            const now = Date.now();
            return (now - timestamp) > CONFIG.STALE_THRESHOLD;
        }

        function formatTimeWithStaleCheck(timestamp) {
            if (!timestamp) {
                return {
                    time: '--:--:--',
                    isStale: true
                };
            }
            
            const date = new Date(timestamp);
            const time = date.toLocaleTimeString('vi-VN');
            const isStale = isDataStale(timestamp);
            
            return {
                time: time,
                isStale: isStale
            };
        }

        // ==================== RENDER FUNCTIONS ====================
        function renderDashboard() {
            const grid = document.querySelector('.grid');
            grid.innerHTML = '';
            
            // Sắp xếp vườn theo thứ tự bảng chữ cái
            const sortedGardens = Object.values(gardenData).sort((a, b) => {
                return (a.name || '').localeCompare(b.name || '');
            });
            
            if (sortedGardens.length === 0) {
                grid.innerHTML = '<div class="loading-message">📡 Chưa có dữ liệu vườn nào...</div>';
                return;
            }
            
            sortedGardens.forEach(garden => {
                const card = createGardenCard(garden);
                grid.appendChild(card);
            });
            
            // Cập nhật số lượng vườn
            updateGardenCount(sortedGardens.length);
        }

        function createGardenCard(garden) {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${garden.name}`;
            
            // Format timestamps với stale check
            const indoorTimeInfo = formatTimeWithStaleCheck(garden.indoor?.timestamp);
            const outdoorTimeInfo = formatTimeWithStaleCheck(garden.outdoor?.timestamp);
            
            // Source badges
            const getSourceBadge = (source) => {
                if (!source) return '';
                const isBackup = source === 'simple_sensor_backup';
                const isLightOnly = source === 'simple_sensor_light_only';
                
                if (isBackup) return '<span class="source-badge backup">⚠️ Backup</span>';
                if (isLightOnly) return '<span class="source-badge primary">ESP</span>';
                return '<span class="source-badge normal">' + source + '</span>';
            };
            
            const indoorSource = getSourceBadge(garden.indoor?.source);
            const outdoorSource = getSourceBadge(garden.outdoor?.source);

            // Get sensor values
            const indoorTemp = garden.indoor?.temp || 0;
            const outdoorTemp = garden.outdoor?.temp || 0;
            const indoorHumidity = garden.indoor?.humidity || 0;
            const outdoorHumidity = garden.outdoor?.humidity || 0;
            const indoorLight = garden.indoor?.light || 0;
            const outdoorLight = garden.outdoor?.light || 0;

            // Get status classes
            const indoorTempStatus = getTempStatus(indoorTemp);
            const outdoorTempStatus = getTempStatus(outdoorTemp);
            const indoorHumidityStatus = getHumidityStatus(indoorHumidity);
            const outdoorHumidityStatus = getHumidityStatus(outdoorHumidity);
            const indoorLightStatus = getLightStatus(indoorLight);
            const outdoorLightStatus = getLightStatus(outdoorLight);
            
            // Create stale indicators
            const indoorStaleIcon = indoorTimeInfo.isStale ? '<span class="stale-icon">🚨</span>' : '';
            const outdoorStaleIcon = outdoorTimeInfo.isStale ? '<span class="stale-icon">🚨</span>' : '';
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="garden-name">${garden.name || 'Unknown'}</div>
                    <div class="update-times">
                        <div class="time-row indoor">
                            <span class="time-label">In:</span>
                            ${indoorStaleIcon}<span class="update-time ${indoorTimeInfo.isStale ? 'stale' : ''}">${indoorTimeInfo.time}</span>
                            ${indoorSource}
                        </div>
                        <div class="time-row outdoor">
                            <span class="time-label">Out:</span>
                            ${outdoorStaleIcon}<span class="update-time ${outdoorTimeInfo.isStale ? 'stale' : ''}">${outdoorTimeInfo.time}</span>
                            ${outdoorSource}
                        </div>
                    </div>
                </div>
                <div class="sensors">
                    <div class="sensor-header">
                        <div></div>
                        <div class="sensor-header-label">Trong nhà</div>
                        <div class="sensor-header-label">Ngoài trời</div>
                    </div>
                    <div class="sensor">
                        <div class="icon">☀️</div>
                        <div class="data">
                            <div class="value status-${indoorTempStatus}" title="${getStatusText(indoorTempStatus)}">${indoorTemp}°C</div>
                        </div>
                        <div class="data">
                            <div class="value status-${outdoorTempStatus}" title="${getStatusText(outdoorTempStatus)}">${outdoorTemp}°C</div>
                        </div>
                    </div>
                    <div class="sensor">
                        <div class="icon">💧</div>
                        <div class="data">
                            <div class="value status-${indoorHumidityStatus}" title="${getStatusText(indoorHumidityStatus)}">${indoorHumidity}%</div>
                        </div>
                        <div class="data">
                            <div class="value status-${outdoorHumidityStatus}" title="${getStatusText(outdoorHumidityStatus)}">${outdoorHumidity}%</div>
                        </div>
                    </div>
                    <div class="sensor">
                        <div class="icon">💡</div>
                        <div class="data">
                            <div class="value status-${indoorLightStatus}" title="${getStatusText(indoorLightStatus)}">${indoorLight} lux</div>
                        </div>
                        <div class="data">
                            <div class="value status-${outdoorLightStatus}" title="${getStatusText(outdoorLightStatus)}">${outdoorLight} lux</div>
                        </div>
                    </div>
                </div>
            `;
            
            return card;
        }

        function updateGardenCount(count) {
            const gardenCountEl = document.getElementById('garden-count');
            if (gardenCountEl) {
                gardenCountEl.textContent = count > 0 ? `(${count} vườn)` : '';
            }
        }

        // ==================== UPDATE FUNCTIONS ====================
        // Cập nhật dữ liệu cho 1 vườn cụ thể
        function updateGardenData(gardenName, newData) {
            if (gardenData[gardenName]) {
                gardenData[gardenName] = { ...gardenData[gardenName], ...newData };
                updateGardenCard(gardenName);
            }
        }

        // Cập nhật toàn bộ dữ liệu
        function updateAllData(newData) {
            if (!newData || typeof newData !== 'object') {
                console.warn('Invalid data received:', newData);
                return;
            }

            // Merge với dữ liệu hiện tại
            gardenData = { ...gardenData, ...newData };
            
            // Đảm bảo mỗi vườn có structure cơ bản
            Object.keys(gardenData).forEach(gardenName => {
                if (!gardenData[gardenName].name) {
                    gardenData[gardenName].name = gardenName;
                }
                
                // Khởi tạo indoor/outdoor nếu chưa có
                if (!gardenData[gardenName].indoor) {
                    gardenData[gardenName].indoor = { temp: 0, humidity: 0, light: 0, timestamp: 0 };
                }
                if (!gardenData[gardenName].outdoor) {
                    gardenData[gardenName].outdoor = { temp: 0, humidity: 0, light: 0, timestamp: 0 };
                }
            });
            
            // Render lại dashboard nếu đã khởi tạo hoặc lần đầu có dữ liệu
            if (isInitialized || Object.keys(gardenData).length > 0) {
                renderDashboard();
                isInitialized = true;
            }
        }

        // Cập nhật chỉ 1 card thay vì render lại toàn bộ
        function updateGardenCard(gardenName) {
            const card = document.getElementById(`card-${gardenName}`);
            if (card) {
                const garden = gardenData[gardenName];
                
                // Source badge helper
                const getSourceBadge = (source) => {
                    if (!source) return '';
                    const isBackup = source === 'simple_sensor_backup';
                    const isLightOnly = source === 'simple_sensor_light_only';
                    
                    if (isBackup) return '<span class="source-badge backup">⚠️ Backup</span>';
                    if (isLightOnly) return '<span class="source-badge primary">ESP</span>';
                    return '<span class="source-badge normal">' + source + '</span>';
                };
                
                // Format timestamps với stale check
                const indoorTimeInfo = formatTimeWithStaleCheck(garden.indoor?.timestamp);
                const outdoorTimeInfo = formatTimeWithStaleCheck(garden.outdoor?.timestamp);
                
                // Cập nhật timestamps và source badges
                const timeRows = card.querySelectorAll('.time-row');
                if (timeRows.length >= 2) {
                    const indoorStaleIcon = indoorTimeInfo.isStale ? '<span class="stale-icon">🚨</span>' : '';
                    const outdoorStaleIcon = outdoorTimeInfo.isStale ? '<span class="stale-icon">🚨</span>' : '';
                    
                    timeRows[0].innerHTML = `
                        <span class="time-label">In:</span>
                        ${indoorStaleIcon}<span class="update-time ${indoorTimeInfo.isStale ? 'stale' : ''}">${indoorTimeInfo.time}</span>
                        ${getSourceBadge(garden.indoor?.source)}
                    `;
                    timeRows[1].innerHTML = `
                        <span class="time-label">Out:</span>
                        ${outdoorStaleIcon}<span class="update-time ${outdoorTimeInfo.isStale ? 'stale' : ''}">${outdoorTimeInfo.time}</span>
                        ${getSourceBadge(garden.outdoor?.source)}
                    `;
                }
                
                // Get sensor values and status
                const indoorTemp = garden.indoor?.temp || 0;
                const outdoorTemp = garden.outdoor?.temp || 0;
                const indoorHumidity = garden.indoor?.humidity || 0;
                const outdoorHumidity = garden.outdoor?.humidity || 0;
                const indoorLight = garden.indoor?.light || 0;
                const outdoorLight = garden.outdoor?.light || 0;

                // Get status classes
                const indoorTempStatus = getTempStatus(indoorTemp);
                const outdoorTempStatus = getTempStatus(outdoorTemp);
                const indoorHumidityStatus = getHumidityStatus(indoorHumidity);
                const outdoorHumidityStatus = getHumidityStatus(outdoorHumidity);
                const indoorLightStatus = getLightStatus(indoorLight);
                const outdoorLightStatus = getLightStatus(outdoorLight);
                
                // Cập nhật values với status classes
                const values = card.querySelectorAll('.value');
                
                if (values.length >= 6) {
                    // Temperature
                    values[0].textContent = `${indoorTemp}°C`;
                    values[0].className = `value status-${indoorTempStatus}`;
                    values[0].title = getStatusText(indoorTempStatus);
                    
                    values[1].textContent = `${outdoorTemp}°C`;
                    values[1].className = `value status-${outdoorTempStatus}`;
                    values[1].title = getStatusText(outdoorTempStatus);
                    
                    // Humidity
                    values[2].textContent = `${indoorHumidity}%`;
                    values[2].className = `value status-${indoorHumidityStatus}`;
                    values[2].title = getStatusText(indoorHumidityStatus);
                    
                    values[3].textContent = `${outdoorHumidity}%`;
                    values[3].className = `value status-${outdoorHumidityStatus}`;
                    values[3].title = getStatusText(outdoorHumidityStatus);
                    
                    // Light
                    values[4].textContent = `${indoorLight} lux`;
                    values[4].className = `value status-${indoorLightStatus}`;
                    values[4].title = getStatusText(indoorLightStatus);
                    
                    values[5].textContent = `${outdoorLight} lux`;
                    values[5].className = `value status-${outdoorLightStatus}`;
                    values[5].title = getStatusText(outdoorLightStatus);
                }
            }
        }

        // ==================== FIREBASE POLLING ====================
        
        async function fetchGardenData() {
            try {
                // Thêm timestamp để tránh cache
                const url = CONFIG.FIREBASE_URL + "/gardens.json?_=" + Date.now();
                
                const response = await fetch(url, {
                    method: "GET",
                    cache: "no-cache",
                    headers: {
                        "Cache-Control": "no-cache"
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data && typeof data === "object") {
                    updateAllData(data);
                    updateConnectionStatus(true);
                } else {
                    console.warn('No garden data received from Firebase');
                    if (!isInitialized) {
                        const grid = document.querySelector('.grid');
                        grid.innerHTML = '<div class="loading-message">🌱 Chưa có dữ liệu vườn nào trong Firebase</div>';
                    }
                }
                
            } catch (error) {
                console.error("Firebase error:", error.message);
                updateConnectionStatus(false);
                
                if (!isInitialized) {
                    const grid = document.querySelector('.grid');
                    grid.innerHTML = '<div class="loading-message">❌ Không thể kết nối Firebase<br><small>Kiểm tra URL và kết nối mạng</small></div>';
                }
            }
        }

        function startPolling() {
            if (!CONFIG.AUTO_UPDATE) return;
            
            console.log("🔥 Firebase polling started (" + CONFIG.POLL_INTERVAL + "ms)");
            fetchGardenData();  // Fetch ngay
            setInterval(fetchGardenData, CONFIG.POLL_INTERVAL);  // Polling định kỳ
        }

        // Status indicator
        function updateConnectionStatus(isConnected) {
            const statusEl = document.getElementById("connection-status");
            if (statusEl) {
                statusEl.textContent = isConnected ? "🔥 Real-time" : "🔴 Offline";
                statusEl.style.color = isConnected ? "var(--text-secondary)" : "#f44336";
            }
        }

        // ==================== THEME TOGGLE ====================
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const theme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
        }

        // ==================== INITIALIZATION ====================
        document.addEventListener('DOMContentLoaded', () => {
            // Start Firebase polling
            if (CONFIG.AUTO_UPDATE) {
                startPolling();
            } else {
                // Fetch một lần ban đầu
                fetchGardenData();
            }
            
            // Update stale indicators every 30 seconds
            setInterval(() => {
                if (isInitialized) {
                    renderDashboard();
                }
            }, 30000);
        });

    </script>
</body>
</html>
